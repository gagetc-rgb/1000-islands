<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blind compare</title>
<style>
  :root { --bg: #f2f2f0; --ink: #1b1b1b; --muted: #555; --line: #d6d6d2; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  header { position: sticky; top: 0; z-index: 2; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 12px 16px; background: #fff; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0 12px 0 0; }
  button { font: inherit; padding: 8px 14px; border: 1px solid var(--ink); background: #fff; border-radius: 6px; cursor: pointer; }
  button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  #result { color: var(--muted); }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; }
  figure { margin: 0; background: #fff; border: 1px solid var(--line); }
  figcaption { padding: 8px 12px; font-weight: 600; border-bottom: 1px solid var(--line); }
  iframe { width: 100%; height: calc(100vh - 120px); border: 0; display: block; }
  main.phone iframe { width: 390px; margin: 0 auto; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Which page is better?</h1>
  <button id="desk" aria-pressed="true">Desktop</button>
  <button id="phone" aria-pressed="false">Phone</button>
  <button data-pick="0">Left is better</button>
  <button data-pick="1">Right is better</button>
  <span id="result"></span>
</header>
<main id="m">
  <figure><figcaption>Left</figcaption><iframe id="f0" title="Left page"></iframe></figure>
  <figure><figcaption>Right</figcaption><iframe id="f1" title="Right page"></iframe></figure>
</main>
<script>
  // Random order per load; the mapping is revealed only after a pick.
  const order = Math.random() < 0.5 ? ["a", "b"] : ["b", "a"];
  f0.src = order[0] + "/index.html"; f1.src = order[1] + "/index.html";
  const label = { a: "A (Anthropic-style evaluator loop)", b: "B (Impeccable)" };
  document.querySelectorAll("[data-pick]").forEach(btn => btn.onclick = () => {
    const i = +btn.dataset.pick;
    result.textContent = `You picked ${label[order[i]]}. Left was ${order[0].toUpperCase()}, right was ${order[1].toUpperCase()}.`;
  });
  desk.onclick = () => { m.classList.remove("phone"); desk.setAttribute("aria-pressed", "true"); phone.setAttribute("aria-pressed", "false"); };
  phone.onclick = () => { m.classList.add("phone"); phone.setAttribute("aria-pressed", "true"); desk.setAttribute("aria-pressed", "false"); };
</script>
</body>
</html>
